<script>

let S = null, err = '', joined = null, replaced = false;

try {
  const j = JSON.parse(store.get('flip7') || 'null');

} catch {}
const qRoom = (new URLSearchParams(location.search).get('room') || '').trim().toUpperCase();

let holdRejoin = !!(joined && urlRoom && urlRoom !== joined.code);

// ---------- connection: one socket, stale events ignored, backoff, half-open detection ----------

function wakeUp() {
  if (replaced) return;
  if (!ws || ws.readyState > 1) return connect();
  if (ws.readyState !== 1 || Date.now() - lastWake < 2000) return;
  lastWake = Date.now();
  const s = ws;
  raw({ type: S ? 'sync' : 'ping' });
  clearTimeout(probeT);
  probeT = setTimeout(() => { if (s === ws && Date.now() - lastMsg > 3000) drop(s); }, 3500);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) wakeUp(); keepAwake(); });
addEventListener('online', wakeUp);
addEventListener('pageshow', (e) => { if (e.persisted) wakeUp(); });
addEventListener('focus', wakeUp);
// Watchdog: the server's protocol pings are invisible to JS, so ping when quiet.
setInterval(() => {
  if (!ws || ws.readyState !== 1 || document.hidden) return;
  const quiet = Date.now() - lastMsg;
  if (quiet > 50000) return drop(ws);
  if (quiet > 20000 && Date.now() - lastPing > 15000) { lastPing = Date.now(); raw({ type: 'ping' }); }
}, 5000);
function forgetSeat(j) { if (!raw({ type: 'leave', code: j.code, token: j.token })) forgetQ.push(j); }

function onMessage(m) {
  switch (m.type) {
    case 'pong': return;
    case 'react': return floatEmoji(m);
    case 'joined':
      if (joined && joined.code !== m.code) forgetSeat(joined); // followed an invite: release the old seat
      joined = { code: m.code, token: m.token };
      store.set('flip7', JSON.stringify(joined));
      holdRejoin = false; urlRoom = m.code; homeBusy = 0;
      setUrl(m.code);
      preload();
      return;
    case 'state': onState(m); break;
    case 'replaced': replaced = true; break;
    case 'notice': flash(m.msg, 6000); return;
    case 'error':
      inflight = 0; homeBusy = 0;
      if (m.gone) {
        joined = null; S = null; holdRejoin = false;
        store.del('flip7');
        urlRoom = m.expired && /^[A-Z]{4}$/.test(m.code || '') ? m.code : '';
        setUrl(urlRoom);
        err = m.msg + (m.expired ? ' You can join again below.' : '');
      } else if (S) return flash(m.msg);
      else err = m.msg;
      break;
    default: return;
  }
  render();
}

const isMine = (st) => !!st && ((st.pending && st.pending.pid === st.you) || (st.phase === 'play' && !st.pending && st.turnId === st.you));
function onState(m) {
  const prev = S, now = Date.now();
  S = m; err = ''; inflight = 0; nextShown = false;
  msTotal = m.msTotal || 45000;
  deadlineAt = m.msLeft != null ? now + m.msLeft : 0;
  graceAt = m.graceLeft != null ? now + m.graceLeft : 0;
  nextAt = m.nextLeft != null ? now + m.nextLeft : 0;
  if (seenRound !== m.round) { seenRound = m.round; seen.clear(); }
  // (Chrome blocks, and logs an error for, vibration before the first tap: e.g. a reload that lands on your turn.)
  if (isMine(m) && !isMine(prev) && navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) { try { navigator.vibrate(50); } catch {} }
  document.title = isMine(m) ? '▶ Your turn · Flip 7' : 'Flip 7 Online';
  if (m.phase !== 'roundEnd' && m.phase !== 'over') hideResults = '';
  if (prev && prev.phase !== m.phase) reactOpen = false;
  keepAwake();
}

// ---------- rendering ----------
function render() {
  if (replaced) return renderReplaced();
  if (!S) return renderHome();
  renderGame();
}
// Replace a region only when its markup changed (keeps scroll, focus, <details> state, images).
function patch(id, html) { const el = $(id); if (el && el._h !== html) { el.innerHTML = html; el._h = html; } }
function mount(view, html, mode) {
  if ($app.dataset.view === view && (mode === undefined || $app.dataset.mode === mode)) return false;
  $app.innerHTML = html;
  $app.dataset.view = view;
  $app.dataset.mode = mode || '';
  return true;
}

function renderReplaced() {
  mount('replaced', `<div class="center"><div class="panel"><h2>Open somewhere else</h2>
    <p class="mut">This game is now open in another tab or on another device.</p>
    <button class="wide" data-act="playhere">Play here instead</button></div></div>`);
}

function renderHome() {
  const rejoining = !!(joined && !holdRejoin);
  const ret = holdRejoin && joined ? joined.code : '';
  const mode = [rejoining ? joined.code : '', urlRoom, ret].join('|');
  const nm = $('name') ? $('name').value : store.get('flip7name') || '';
  const cd = $('code') ? $('code').value : '';
  const logo = `<img class="logo" src="${src('back')}" width="181" height="253" alt="Flip 7">`;
  const html = rejoining
    ? `<div class="center"><div class="panel">${logo}<h2>Rejoining room ${esc(joined.code)}…</h2>
        <div class="mut" id="homestat"></div><div class="err" id="homeerr" role="alert"></div>
        <button class="alt wide" data-act="forget">Leave that game</button></div></div>`
    : `<div class="home">${logo}<h1 class="sr">Flip 7 Online</h1>
      <form class="panel" id="homeform" novalidate autocomplete="off">
        <label for="name">Your name</label>
        <input id="name" maxlength="16" autocomplete="nickname" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="e.g. Alex" value="${esc(nm)}">
        ${urlRoom
          ? `<button type="submit" class="big" data-submit="join">Join room ${esc(urlRoom)}</button>
             ${ret ? `<button type="button" class="alt" data-act="return">Back to game ${esc(ret)}</button>` : ''}
             <button type="button" class="alt" data-act="create">Create a new room instead</button>`
          : `<button type="submit" class="big" data-submit="create">Create a room</button>
             <div class="or">or join with a code</div>
             <div class="row"><input id="code" maxlength="4" placeholder="CODE" aria-label="Room code" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="go" value="${esc(cd)}"><button type="button" class="alt" data-act="join">Join</button></div>`}
        <div class="err" id="homeerr" role="alert"></div>
        <div class="mut" id="homestat"></div>
      </form>
      <div class="panel rules"><h2>How to play</h2><ul>
        <li><b>Hit</b> to flip a card, <b>stay</b> to bank your round points.</li>
        <li>A <b>duplicate number busts</b> you: zero points for the round.</li>
        <li>Seven different numbers is a <b>Flip 7</b>: +15 and the round ends.</li>
        <li>Freeze, Flip Three and Second Chance shake things up. First to <b>200</b> wins.</li>
      </ul></div></div>`;
  const focus = document.activeElement && document.activeElement.id;
  if (mount('home', html, mode) && focus && $(focus)) $(focus).focus();
  const e = $('homeerr'); if (e) e.textContent = err;
  const st = $('homestat'); if (st) st.textContent = online ? '' : 'Connecting to the server…';
  document.querySelectorAll('#app [data-submit], #app [data-act="join"], #app [data-act="create"]').forEach((b) => b.classList.toggle('busy', !!homeBusy));
}

function renderGame() {
  if (mount('game', `<div class="game" id="game">
      <header class="top" id="r-top"></header>
      <div class="status" id="r-status"></div>
      <main class="board" id="board"><div id="r-board"></div>
        <details id="logd"><summary>Game log</summary><div class="log" id="r-log"></div></details></main>
      <section class="dock" id="r-dock" aria-label="Your hand and actions"></section>
    </div><div id="r-modal"></div><div id="r-over"></div>`)) firstPaint = true;
  const by = {};
  for (const p of S.players) by[p.id] = p;
  const me = by[S.you];
  const armed = Date.now() - leaveArmed < 3000;
  patch('r-top', `<button class="chip" data-act="invite" aria-label="Invite friends to room ${esc(S.code)}"><b>${esc(S.code)}</b>${SHARE}</button>
    <div class="hinfo">${S.phase === 'lobby' ? '' : `<span>Round <b>${S.round}</b></span><span title="Cards left in the deck"><img src="${src('back')}" width="181" height="253" alt="Deck">${S.deckCount}</span><span class="xw">to <b>${S.target}</b></span>`}</div>
    <button class="ghost leave" data-act="leave">${armed ? 'Tap again to leave' : 'Leave'}</button>`);
  patch('r-status', statusHtml(by));
  patch('r-board', S.phase === 'lobby' ? lobbyHtml() : `<div class="opps">${S.players.filter((p) => p.id !== S.you).map(oppHtml).join('')}</div>`);
  $('logd').hidden = S.phase === 'lobby';
  patch('r-log', S.log.slice().reverse().map((l) => `<div>${esc(l)}</div>`).join(''));
  patch('r-dock', (S.phase !== 'lobby' && me ? meHtml(me) : '') + `<div class="bar" id="bar">${barHtml(me, by)}</div>`
    + (reactOpen ? `<div class="reactpop" role="menu">${REACTS.map((e) => `<button data-act="emo" data-e="${e}" aria-label="React ${e}">${e}</button>`).join('')}</div>` : ''));
  patch('r-modal', modalHtml(by, armed));
  // Animate cards the first time they appear (not on the first paint after joining).
  document.querySelectorAll('#game [data-k]').forEach((el) => {
    if (seen.has(el.dataset.k)) return;
    seen.add(el.dataset.k);
    if (!firstPaint) el.classList.add('pop');
  });
  firstPaint = false;
  tick();
}

function statusHtml(by) {
  const actor = S.pending ? S.pending.pid : S.turnId;
  const name = (id) => esc(by[id] ? by[id].name : '?');
  let msg, cls = '';
  if (S.phase === 'lobby') msg = `Waiting room <small>· ${S.players.length}/12 players</small>`;
  else if (S.pending) {
    if (S.pending.pid === S.you) { cls = 'me'; msg = `Pick a player for ${cardName(S.pending.card)}`; }
    else msg = `${name(S.pending.pid)} is choosing for ${cardName(S.pending.card)}…`;
  } else if (S.phase === 'play' && S.turnId) {
    if (S.turnId === S.you) { cls = 'me'; msg = 'Your turn! Hit or stay?'; } else msg = `${name(S.turnId)}'s turn`;
  } else if (S.phase === 'roundEnd') msg = `Round ${S.round} over`;
  else if (S.phase === 'over') msg = `🏆 ${name(S.winner)} wins!`;
  else msg = 'Dealing…';
  if (actor && actor !== S.you && by[actor] && !by[actor].connected) msg += '<small id="grace"></small>';
  return `<div class="timer${deadlineAt && actor ? '' : ' off'}" id="timer"><i></i></div><div class="banner ${cls}" role="status" aria-live="polite">${msg}</div>`;
}

function lobbyHtml() {
  return `<div class="panel lobbyp"><div class="mut">Room code</div><div class="bigcode">${esc(S.code)}</div>
    <button class="alt wide" data-act="invite">${SHARE} Share invite link</button>
    <p class="mut">2–12 players. Friends join with the link or the code.</p></div>
    <div class="opps">${S.players.map((p) => `<div class="pl${p.id === S.you ? ' me' : ''}${p.connected ? '' : ' away'}"><div class="nm"><span class="n">${esc(p.name)}${p.id === S.you ? ' <small>(you)</small>' : p.away ? ' <small>offline</small>' : ''}</span>${p.id === S.hostId ? '<span title="Host">👑</span>' : ''}${p.connected ? '' : `<span title="${p.away ? 'Offline: left out if the game starts now' : 'Reconnecting'}">💤</span>`}</div></div>`).join('')}</div>`;
}

const pill = (p) => (p.left ? '<span class="st">left</span>' : p.status !== 'active' ? `<span class="st ${p.status}">${p.status}</span>` : '');
function minis(p, noKey) {
  const k = (x) => (noKey ? '' : ` data-k="${S.round}:${esc(p.id)}:${x}"`);
  let h = [...p.numbers].sort((a, b) => a - b).map((n) => `<span class="mc"${k('n' + n)}>${n}</span>`).join('');
  h += p.mods.map((c) => `<span class="mc m"${k(cardImg(c))}>${c.k === 'x' ? '×2' : '+' + c.v}</span>`).join('');
  if (p.second) h += `<span class="mc sc"${k('second')} title="Second Chance">2nd</span>`;
  if (p.bustCard) h += `<span class="mc bust"${k('b' + p.bustCard.v)} title="Bust card">${p.bustCard.v}</span>`;
  return h;
}
function cardsLabel(p) {
  const parts = [...p.numbers].sort((a, b) => a - b).map(String).concat(p.mods.map(cardName));
  if (p.second) parts.push('Second Chance');
  if (p.bustCard) parts.push('busted on ' + p.bustCard.v);
  return parts.length ? 'Cards: ' + parts.join(', ') : 'No cards';
}
function oppHtml(p) {
  const acting = p.id === S.turnId || (S.pending && S.pending.pid === p.id);
  return `<div class="pl${acting ? ' turn' : ''}${p.status !== 'active' ? ' out' : ''}${p.connected ? '' : ' away'}">
    <div class="nm"><span class="n">${esc(p.name)}</span>${p.id === S.hostId ? '<span title="Host">👑</span>' : ''}${!p.connected && !p.left ? '<span title="Reconnecting">💤</span>' : ''}${pill(p)}</div>
    <div class="minis" role="img" aria-label="${esc(cardsLabel(p))}">${minis(p)}</div>
    <div class="meta"><span>Round <b>${p.score}</b>${p.flip7 ? ' ⭐' : ''}</span><span>Total <b>${p.total}</b></span></div></div>`;
}
function meHtml(me) {
  const items = [...me.numbers].sort((a, b) => a - b).map((n) => ({ img: 'n' + n, k: 'n' + n, alt: String(n) }));
  me.mods.forEach((c) => items.push({ img: cardImg(c), k: cardImg(c), alt: cardName(c) }));
  if (me.second) items.push({ img: 'second', k: 'second', alt: 'Second Chance' });
  if (me.bustCard) items.push({ img: 'n' + me.bustCard.v, k: 'b' + me.bustCard.v, alt: 'Bust: ' + me.bustCard.v, bust: 1 });
  const tray = items.length
    ? items.map((it) => `<img src="${src(it.img)}" width="181" height="253" alt="${esc(it.alt)}" data-k="${S.round}:${esc(me.id)}:${it.k}"${it.bust ? ' class="bust"' : ''}>`).join('')
    : '<span class="empty">No cards yet</span>';
  return `<div class="pl me${me.id === S.turnId ? ' turn' : ''}${me.status !== 'active' ? ' out' : ''}">
    <div class="nm"><span class="n">${esc(me.name)} <small>(you)</small>${S.hostId === me.id ? ' 👑' : ''}</span>${pill(me)}</div>
    <div class="tray" style="--n:${Math.max(1, items.length)}">${tray}</div>
    <div class="meta"><span>Round <b>${me.score}</b>${me.flip7 ? ' ⭐ Flip 7!' : ''}</span><span>Total <b>${me.total}</b> / ${S.target}</span></div></div>`;
}

const canContinue = () => S.hostId === S.you || (!!nextAt && Date.now() >= nextAt);
function barHtml(me, by) {
  const busy = inflight ? ' busy' : '';
  const hostName = esc(by[S.hostId] ? by[S.hostId].name : 'the host');
  const emo = `<button class="emo" data-act="react" aria-label="Send a reaction" aria-expanded="${reactOpen}">😀</button>`;
  if (S.phase === 'lobby') {
    if (S.hostId !== S.you) return emo + `<div class="wait">Waiting for ${hostName} to start…</div>`;
    const n = S.players.filter((p) => !p.away).length; // offline seats are not dealt in
    return emo + (n < 2 ? '<button class="go" data-act="start" disabled>Need 2+ players</button>'
      : `<button class="go${busy}" data-act="start" aria-label="Start game with ${n} players">Start game<span class="cnt"><i> · </i>${n} players</span></button>`);
  }
  if (S.phase === 'roundEnd' || S.phase === 'over') {
    const over = S.phase === 'over';
    return emo + (hideResults ? '<button class="alt" data-act="showres">Results</button>' : '')
      + (canContinue() ? `<button class="go${busy}" data-act="${over ? 'again' : 'next'}">${over ? 'Play again' : 'Next round'}</button>` : `<div class="wait">Waiting for ${hostName}…</div>`);
  }
  if (me && S.phase === 'play' && !S.pending && S.turnId === S.you) {
    return emo + `<button class="hit${busy}" data-act="hit">Hit</button><button class="stay${busy}" data-act="stay">Stay · ${me.score}</button>`;
  }
  let w = '…';
  if (S.pending && S.pending.pid === S.you) w = 'Pick a player…';
  else if (me && me.status === 'busted') w = 'Busted! Wait for the next round.';
  else if (me && me.status === 'frozen') w = `Frozen · ${me.score} pts banked`;
  else if (me && me.status === 'stayed') w = `You stayed · ${me.score} pts`;
  else if (S.pending) w = `${esc(by[S.pending.pid] ? by[S.pending.pid].name : '?')} is choosing…`;
  else if (S.turnId) w = `${esc(by[S.turnId] ? by[S.turnId].name : '?')}'s turn…`;
  return emo + `<div class="wait">${w}</div>`;
}

function modalHtml(by, armed) {
  const leaveBtn = `<button class="alt leave" data-act="leave">${armed ? 'Tap again' : 'Leave'}</button>`;
  if (S.pending && S.pending.pid === S.you) {
    const c = S.pending.card;
    const desc = { freeze: 'They bank their points and sit out the rest of the round.', flip3: 'They must flip the next three cards.', second: 'You already hold one, so give this one away.' }[c.a] || '';
    return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="box">
      <img class="card" src="${src(cardImg(c))}" width="181" height="253" alt="">
      <h2 id="mt">${cardName(c)}</h2><p class="mut">${desc}</p>
      <div class="targets">${S.pending.options.map((id) => {
        const p = by[id] || { name: '?', score: 0, total: 0, numbers: [], mods: [] };
        return `<button class="tgt${inflight ? ' busy' : ''}" data-act="target" data-id="${esc(id)}"><span class="tn"><b>${esc(p.name)}${id === S.you ? ' (you)' : ''}</b><small>${p.score} pts · total ${p.total}</small></span><span class="minis">${minis(p, true)}</span></button>`;
      }).join('')}</div>
      <button class="ghost leave wide" data-act="leave">${armed ? 'Tap again to leave' : 'Leave game'}</button></div></div>`;
  }
  if ((S.phase === 'roundEnd' || S.phase === 'over') && S.lastRound && hideResults !== S.phase + S.round) {
    const over = S.phase === 'over';
    const rr = {};
    for (const r of S.lastRound) rr[r.id] = r;
    const rows = S.players.slice().sort((a, b) => b.total - a.total).map((p, i) => {
      const r = rr[p.id];
      const pts = !r ? '–' : r.busted ? '<span class="bust-t">Bust</span>' : `+${r.pts}${r.flip7 ? ' ⭐' : ''}`;
      return `<tr${p.id === S.you ? ' class="me"' : ''}><td class="rk">${i + 1}</td><td class="pn">${esc(p.name)}${p.id === S.winner ? ' 🏆' : ''}<span class="prog"><i style="width:${Math.min(100, (p.total / S.target) * 100).toFixed(1)}%"></i></span></td><td class="num">${pts}</td><td class="num"><b>${p.total}</b></td></tr>`;
    }).join('');
    const hostName = esc(by[S.hostId] ? by[S.hostId].name : 'the host');
    return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="box">
      <h2 id="mt" class="${over ? 'win' : ''}">${over ? `🏆 ${esc(by[S.winner] ? by[S.winner].name : '')} wins!` : `Round ${S.round} results`}</h2>
      <table class="res"><thead><tr><th></th><th>Player</th><th class="num">Round</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="foot">
        ${canContinue() ? `<button class="wide${inflight ? ' busy' : ''}" data-act="${over ? 'again' : 'next'}">${over ? 'Play again' : 'Next round'}</button>` : `<p class="mut">Waiting for ${hostName} to continue. <span class="nextcd"></span></p>`}
        <div class="two"><button class="alt" data-act="hideres">View table</button>${leaveBtn}</div>
      </div></div></div>`;
  }
  return '';
}

function overlayHtml() {
  let h = '';
  if (!online && offlineSince && Date.now() - offlineSince > 1500) h += '<div class="conn" role="status">Reconnecting…</div>';
  if (toastMsg) h += `<div class="toast" role="status">${esc(toastMsg)}</div>`;
  return h;
}

// Timer bar, countdowns and the connection banner update in place.
function tick() {
  const now = Date.now();
  if ($app.dataset.view === 'game' && S) {
    const t = $('timer');
    if (t && deadlineAt) {
      const left = Math.max(0, deadlineAt - now);
      t.firstElementChild.style.transform = `scaleX(${(left / msTotal).toFixed(4)})`;
      t.classList.toggle('low', left < 10000);
    }
    const g = $('grace');
    if (g) g.textContent = graceAt ? ` · reconnecting ${Math.ceil(Math.max(0, graceAt - now) / 1000)}s` : ' · reconnecting';
    document.querySelectorAll('.nextcd').forEach((el) => { el.textContent = nextAt > now ? `Anyone can continue in ${Math.ceil((nextAt - now) / 1000)}s.` : ''; });
    if (nextAt && now >= nextAt && !nextShown) { nextShown = true; render(); return; }
    patch('r-over', overlayHtml());
  } else {
    const st = $('homestat');
    if (st) st.textContent = online ? '' : 'Connecting to the server…';
  }
}
setInterval(tick, 250);

// ---------- actions ----------
function act(type, extra) {
  if (!S || (inflight && Date.now() - inflight < 4000)) return;
  if (!raw({ type, seq: S.seq, ...extra })) { flash('Reconnecting… try again in a moment.'); wakeUp(); return; }
  inflight = Date.now(); // buttons stay disabled until the next state: no double hits
  render();
}
function flash(msg, ms = 3500) {
  if (!S) { err = msg; render(); return; }
  toastMsg = msg;
  clearTimeout(toastT);
  toastT = setTimeout(() => { toastMsg = ''; render(); }, ms);
  render();
}
function invite() {
  const url = location.origin + '/?room=' + S.code;
  if (navigator.share && matchMedia('(pointer:coarse)').matches) navigator.share({ title: 'Flip 7', text: `Join my Flip 7 game! Room ${S.code}`, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => flash('Invite link copied!'), () => flash(url, 8000));
  else flash(url, 8000);
}
function leaveClick() {
  if (Date.now() - leaveArmed > 3000) { // two taps: confirm() is blocked in some in-app browsers
    leaveArmed = Date.now();
    render();
    setTimeout(render, 3050);
    return;
  }
  leaveArmed = 0;
  if (joined) forgetSeat(joined);
  joined = null; S = null; urlRoom = ''; holdRejoin = false; err = ''; hideResults = ''; reactOpen = false;
  store.del('flip7');
  setUrl('');
  document.title = 'Flip 7 Online';
  keepAwake();
  render();
}
function homeAction(a) {
  if (a === 'forget') {
    if (joined) forgetSeat(joined);
    joined = null; holdRejoin = false; err = '';
    store.del('flip7');
    return render();
  }
  if (a === 'return') {
    holdRejoin = false; urlRoom = joined.code;
    setUrl(joined.code);
    raw({ type: 'rejoin', code: joined.code, token: joined.token });
    return render();
  }
  if (homeBusy && Date.now() - homeBusy < 4000) return;
  const nameEl = $('name');
  const name = nameEl ? nameEl.value.trim() : '';
  if (!name) { err = 'Enter your name first.'; render(); if (nameEl) nameEl.focus(); return; }
  store.set('flip7name', name);
  let msg;
  if (a === 'create') msg = { type: 'create', name };
  else {
    const code = urlRoom || ($('code') ? $('code').value.trim().toUpperCase() : '');
    if (!/^[A-Z]{4}$/.test(code)) { err = 'Enter the 4-letter room code.'; render(); if ($('code')) $('code').focus(); return; }
    msg = { type: 'join', code, name };
  }
  if (!raw(msg)) { err = 'Still connecting… try again in a moment.'; wakeUp(); return render(); }
  homeBusy = Date.now(); err = '';
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // close the keyboard
  render();
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (reactOpen && !e.target.closest('.reactpop, [data-act="react"]')) { reactOpen = false; render(); }
  if (!b || b.disabled || !$app.contains(b)) return;
  keepAwake();
  const a = b.dataset.act;
  switch (a) {
    case 'hit': case 'stay': case 'start': case 'next': case 'again': return act(a);
    case 'target': return act('target', { id: b.dataset.id });
    case 'invite': return invite();
    case 'leave': return leaveClick();
    case 'react': reactOpen = !reactOpen; return render();
    case 'emo': raw({ type: 'react', e: b.dataset.e }); reactOpen = false; return render();
    case 'hideres': hideResults = S.phase + S.round; return render();
    case 'showres': hideResults = ''; return render();
    case 'playhere': replaced = false; $app.dataset.view = ''; connect(); return render();
    case 'create': case 'join': case 'return': case 'forget': return homeAction(a);
    default:
  }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const ae = document.activeElement;
  homeAction(ae && ae.id === 'code' ? 'join' : (e.submitter && e.submitter.dataset.submit) || (urlRoom ? 'join' : 'create'));
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'name') store.set('flip7name', t.value);
  if (t.id === 'code') { const v = t.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); if (v !== t.value) t.value = v; }
  if (err && !S) { err = ''; const el = $('homeerr'); if (el) el.textContent = ''; }
});

function floatEmoji(m) {
  if (!REACTS.includes(m.e) || document.querySelectorAll('.float').length >= 6) return;
  const p = S && S.players.find((x) => x.id === m.from);
  const el = document.createElement('div');
  el.className = 'float';
  el.style.left = (8 + Math.random() * 72) + 'vw';
  el.innerHTML = `${m.e}<small>${p ? esc(p.name) : ''}</small>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// Fetch all card art once seated (~210 KB of WebP) so drawn cards show instantly.
let preloaded = false;
function preload() {
  if (preloaded) return;
  preloaded = true;
  const go = () => CARDS.forEach((c) => { const i = new Image(); i.src = src(c); });
  if ('requestIdleCallback' in window) requestIdleCallback(go, { timeout: 2500 }); else setTimeout(go, 800);
}

// Keep the phone screen on while seated in a room (a locked screen drops the connection).
let wakeLock = null, wakeBusy = false;
async function keepAwake() {
  if (!('wakeLock' in navigator) || wakeBusy) return;
  const want = !!S && document.visibilityState === 'visible';
  if (want === !!wakeLock) return;
  wakeBusy = true;
  try {
    if (want) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch { wakeLock = null; }
  wakeBusy = false;
}

connect();
render();
</script>
